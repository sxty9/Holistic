         administrator, and a copy in a shared cache or inside somebody else's
         iframe is not a page, it is a hazard. The server sends the same
         headers; this is the half a proxy sees. -->
    <meta http-equiv="Cache-Control" content="no-store" />
    <meta name="referrer" content="no-referrer" />
